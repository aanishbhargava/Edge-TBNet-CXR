# Edge-TBNet Default Experiment Configuration
experiment:
  name: "Edge-TBNet-CXR-Screening"
  seed: 42

dataset:
  name: "Shenzhen-Montgomery-Cohort"
  total_samples: 800
  input_resolution: [224, 224]
  channels: 3
  split_ratios: [0.70, 0.15, 0.15]
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]

model:
  backbone: "mobilenet_v3_small"
  pretrained: true
  attention: "dual_stage_cbam"
  cbam_reduction_ratio: 16
  dropout: 0.3
  target_classes: 1

training:
  batch_size: 32
  max_epochs: 50
  early_stopping_patience: 10
  optimizer: "AdamW"
  weight_decay: 0.01
  learning_rates:
    backbone: 0.0001
    attention_and_head: 0.001
  scheduler:
    type: "CosineAnnealingWarmRestarts"
    T_0: 10
    T_mult: 1
